name: C build and integration tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build with warnings enabled
        run: make clean all
      - name: Run checkpoint integration tests
        run: make test